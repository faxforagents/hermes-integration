name: ci

# Modelled on faxforagents/kiro-power/.github/workflows/ci.yml, actions pinned by SHA.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: portable loading tests on Hermes v0.22.7
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/requirements.txt
      - name: Fetch Hermes v0.22.7 and check the pins
        run: sh tests/fetch-hermes.sh
      - name: Run the tests
        run: python -m pytest -v tests
